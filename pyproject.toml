[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "watchfloor"
version = "0.1.0"
description = "AI-assisted maritime and air domain awareness workbench: Kafka -> Snowflake -> anomaly detection -> human-approved LLM analyst reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "kafka-python>=2.1",
    "snowflake-connector-python[pandas]>=3.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "websockets>=13",
    "dash>=2.17",
    "plotly>=5.24",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wf-ingest-adsb = "watchfloor.ingest.adsb_producer:main"
wf-ingest-ais = "watchfloor.ingest.ais_producer:main"
wf-load = "watchfloor.load.snowflake_sink:main"
wf-dashboard = "watchfloor.dashboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watchfloor = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:dash"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests
